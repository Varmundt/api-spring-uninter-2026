spring.application.name=baozi-store
server.port=8080

# Banco de dados H2 (arquivo local em ./data) - nao precisa instalar nada
spring.datasource.url=jdbc:h2:file:./data/baozidb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate: cria e atualiza as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console web do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
