# Perfil opcional para MySQL. Execute com: --spring.profiles.active=mysql
# Antes, crie o banco: CREATE DATABASE baozistore;
spring.datasource.url=jdbc:mysql://localhost:3306/baozistore?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.h2.console.enabled=false
